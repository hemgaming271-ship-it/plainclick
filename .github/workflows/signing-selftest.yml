# Proves the Windows-only signing path works before any real Apple certificate exists:
#   1. Windows runner: tools/signing scripts make a CSR, a THROWAWAY test CA issues a cert, the .p12 is exported.
#   2. macOS runner: the .p12 is imported with EXACTLY the commands release.yml uses, and the app is code-signed with it.
# The test certificate is not trusted by Gatekeeper and is useless outside this test.
name: Signing helpers self-test

on:
  workflow_dispatch:
  push:
    paths: ["tools/signing/**", ".github/workflows/signing-selftest.yml", ".github/workflows/release.yml", "apps/macos/Sources/PlainClickLicensing/**"]

permissions:
  contents: read

jobs:
  windows-export:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run helper scripts with a throwaway CA (Windows PowerShell 5.1, like the user's PC)
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\signing\Test-SigningHelpers.ps1 -KeepDir "$env:RUNNER_TEMP\p12out"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # FREE mode: throwaway self-signed certificate made by the same script the user runs.
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\signing\New-SelfSignedSigningCert.ps1 -Name "PlainClick Selftest" -OutDir "$env:RUNNER_TEMP\p12out\self"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: throwaway-test-p12
          path: ${{ runner.temp }}/p12out/
          retention-days: 1

  macos-import-and-sign:
    needs: windows-export
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: throwaway-test-p12
          path: p12
      - name: Import exactly like release.yml
        run: |
          set -euo pipefail
          P12_B64="$(cat p12/MACOS_CERT_P12_BASE64.txt)"
          P12_PASSWORD="$(cat p12/MACOS_CERT_P12_PASSWORD.txt)"
          EXPECTED="$(cat p12/expected-sha1.txt)"
          KEYCHAIN="$RUNNER_TEMP/plainclick-signing.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          # Stand-in for Apple's chain. Real Developer ID certs chain to Apple's root, which every Mac trusts; to
          # reproduce that, trust the throwaway CA on this disposable runner only.
          security import p12/throwaway-ca.cer -k "$KEYCHAIN"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain p12/throwaway-ca.cer
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "--- identities (all, including untrusted test cert):"
          security find-identity -p codesigning "$KEYCHAIN" | tee "$RUNNER_TEMP/ids.txt"
          grep -qi "$EXPECTED" "$RUNNER_TEMP/ids.txt" || { echo "::error::Imported identity not found"; exit 1; }
          echo "PASS: Windows-made .p12 imported on macOS with its private key ($EXPECTED)"
          echo "- PASS: Windows-made .p12 imported on macOS with its private key" >> "$GITHUB_STEP_SUMMARY"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "TEST_IDENTITY=$EXPECTED" >> "$GITHUB_ENV"
      - name: "Code-sign the app with the imported key (no --timestamp, test cert)"
        working-directory: apps/macos
        run: |
          set -euo pipefail
          swift build -c release
          APP=build/SigTest.app
          mkdir -p "$APP/Contents/MacOS"
          cp "$(swift build -c release --show-bin-path)/PlainClickPrototype" "$APP/Contents/MacOS/"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          set +e
          OUT="$(codesign --force --options runtime --sign "$TEST_IDENTITY" --keychain "$KEYCHAIN" "$APP" 2>&1)"; RC=$?
          INFO="$(codesign -dv --verbose=2 "$APP" 2>&1)"
          set -e
          { echo '```'; echo "codesign exit $RC"; echo "$OUT"; echo "$INFO" | grep -E 'Authority|Runtime|flags|Signature'; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ $RC = 0 ] && echo "$INFO" | grep -q "Authority=Developer ID Application: PlainClick Selftest"; then
            echo "- PASS: app signed with the Windows-exported key" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::codesign rc=$RC | $(echo "$OUT" | tr '\n' ' ' | cut -c1-500) | $(echo "$INFO" | grep -E 'Authority|Signature' | tr '\n' ' ' | cut -c1-300)"
            echo "::error::identities: $(security find-identity -p codesigning "$KEYCHAIN" | tr '\n' ' ' | cut -c1-400)"
            exit 1
          fi
          echo "(Gatekeeper rejection is expected here: the throwaway CA is not Apple.)"
      - name: "FREE mode: self-signed cert, imported and trusted exactly like release.yml, signs with a stable identity"
        working-directory: apps/macos
        run: |
          set -eEuo pipefail
          trap 'echo "::error::FREE-mode step failed at line $LINENO: $BASH_COMMAND"' ERR
          KC="$RUNNER_TEMP/self.keychain-db"; KC_PASS="$(uuidgen)"
          base64 --decode < ../../p12/self/SELFSIGNED_P12_BASE64.txt > "$RUNNER_TEMP/self.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/self.p12" -P "$(cat ../../p12/self/SELFSIGNED_P12_PASSWORD.txt)" -f pkcs12 -k "$KC" -T /usr/bin/codesign
          security find-certificate -a -p "$KC" > "$RUNNER_TEMP/self.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/self.pem"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID="$(security find-identity -v -p codesigning "$KC" | grep '"' | head -1 | awk '{print $2}')"
          [ -n "$ID" ] || { echo "::error::self-signed identity not valid after import: $(security find-identity -p codesigning "$KC" | tr '\n' ' ')"; exit 1; }
          # Two builds with DIFFERENT code: the designated requirement (what Accessibility permission is tied to)
          # must stay identical with the self-signed cert, and changes with ad-hoc signing.
          dr_of() { codesign -d -r- "$1" 2>&1 | grep -E '^designated'; }
          # "Version 1" and "version 2" = two genuinely different executables under the same bundle id.
          mkapp() {
            rm -rf "$1"; mkdir -p "$1/Contents/MacOS"
            cp "$(swift build -c release --show-bin-path)/$2" "$1/Contents/MacOS/PlainClickPrototype"
            cp Resources/Info.plist "$1/Contents/Info.plist"
          }
          swift build -c release
          set +e
          mkapp build/A.app PlainClickPrototype; OUT1="$(codesign --force --options runtime --sign "$ID" --keychain "$KC" build/A.app 2>&1)"; RC1=$?
          mkapp build/B.app plainclick-feasibility; OUT2="$(codesign --force --options runtime --sign "$ID" --keychain "$KC" build/B.app 2>&1)"; RC2=$?
          set -e
          [ $RC1 = 0 ] && [ $RC2 = 0 ] || { echo "::error::self-signed codesign failed: $OUT1 | $OUT2"; exit 1; }
          codesign --verify --strict build/A.app
          DRA="$(dr_of build/A.app)"; DRB="$(dr_of build/B.app)"
          mkapp build/C.app PlainClickPrototype; codesign --force --sign - build/C.app
          mkapp build/D.app plainclick-feasibility; codesign --force --sign - build/D.app
          DRC="$(dr_of build/C.app)"; DRD="$(dr_of build/D.app)"
          echo "self-signed A: $DRA"; echo "self-signed B: $DRB"; echo "ad-hoc C: $DRC"; echo "ad-hoc D: $DRD"
          echo "$DRA" | grep -q 'certificate leaf' || { echo "::error::DR not tied to the certificate: $DRA"; exit 1; }
          [ "$DRA" = "$DRB" ] || { echo "::error::self-signed DR changed between builds: $DRA vs $DRB"; exit 1; }
          [ "$DRC" != "$DRD" ] || echo "::warning::ad-hoc DR did not change between builds (unexpected)"
          echo "::notice::FREE mode OK: self-signed identity is stable across builds (DR unchanged); ad-hoc DR changes every build."
          security delete-keychain "$KC"
      - name: Cleanup
        if: always()
        run: '[ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true'
