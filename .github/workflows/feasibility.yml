# Phase 0 feasibility tests against REAL TextEdit, Finder and Safari on a GitHub-hosted macOS VM.
# This is real macOS with real apps, but not a physical user's Mac: one virtual display, no human, preinstalled
# runner permissions. Results go to the job summary and the "feasibility-report" artifact.
name: Feasibility (real apps on macOS)

# Manual only: each run uses ~4 macOS jobs, and macOS minutes count 10x on private repositories.
# Run it from the Actions tab ("Run workflow") after changing the app or the engine.
on:
  workflow_dispatch:

jobs:
  feasibility:
    strategy:
      fail-fast: false
      matrix:
        # macos-26 = macOS Tahoe (Liquid Glass), the release that motivates PlainClick.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v5
      - name: Record environment
        run: |
          sw_vers
          xcodebuild -version
      - name: Build harness
        run: swift build -c release --product plainclick-feasibility
      - name: Run feasibility tests
        run: |
          mkdir -p out
          "$(swift build -c release --show-bin-path)/plainclick-feasibility" "$PWD/out"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feasibility-report-${{ matrix.os }}
          path: apps/macos/out

  # Drives the REAL PlainClick app: real hotkey, real mouse clicks on the panel, focus checks, screenshots.
  ui-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: write   # to publish screenshots to a ci-ui-* branch
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v5
      - name: Build app bundle
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh
      - name: Run UI test (real app, max 4 minutes)
        run: |
          mkdir -p ui-out
          "build/PlainClick Prototype.app/Contents/MacOS/PlainClickPrototype" --ui-test "$PWD/ui-out" > ui-out/stdout.txt 2>&1 &
          APP_PID=$!
          for i in $(seq 1 240); do kill -0 $APP_PID 2>/dev/null || break; sleep 1; done
          kill $APP_PID 2>/dev/null || true
          sleep 15
          # Keep any crash report so failures can be diagnosed without a Mac.
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -iname '*PlainClick*' -exec cp {} ui-out/ \; 2>/dev/null || true
          cat ui-out/stdout.txt
          [ -f ui-out/ui-report.md ] && cat ui-out/ui-report.md >> "$GITHUB_STEP_SUMMARY"
          ls -la ui-out
      - name: Upload UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-${{ matrix.os }}
          path: apps/macos/ui-out
      - name: Publish screenshots to branch ci-ui-${{ matrix.os }}
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ui-out
          git init -q
          git checkout -q -b out
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "UI test output (${{ matrix.os }}, ${{ github.sha }})" || exit 0
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" out:ci-ui-${{ matrix.os }}
